<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Strict CSP: everything is self-hosted (no third-party requests). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script src="{{root}}assets/js/theme-init.js"></script>
<title>{{page.title}}</title>
<meta name="description" content="{{page.description}}">
<link rel="canonical" href="{{config.url}}{{page.path}}">
<meta name="theme-color" content="{{config.themeColor}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{config.name}}">
<meta property="og:title" content="{{page.title}}">
<meta property="og:description" content="{{page.description}}">
<meta property="og:url" content="{{config.url}}{{page.path}}">
<meta property="og:image" content="{{config.url}}/assets/img/brand/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="512x512" href="{{root}}assets/img/brand/icon-512.png">
<link rel="apple-touch-icon" href="{{root}}assets/img/brand/icon-512.png">
<link rel="manifest" href="{{root}}site.webmanifest">
<link rel="preload" href="{{root}}assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{root}}assets/css/site.css?v={{build}}">
{{page.jsonld}}
</head>
<body>
